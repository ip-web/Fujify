name: Multiplatform CI/CD (Desktop + Android + iOS)

on:
  push:
    branches: [ master, main, "feature/**" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. Desktop & Core Tests (Windows, Linux, macOS)
  # -------------------------------------------------------------
  test-and-desktop:
    name: Build & Test Core (Windows, Linux, macOS)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore FujifyNET.sln

      - name: Run Test Suite
        run: dotnet test Fujify.Tests/Fujify.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test_results.trx"

      - name: Publish Windows Desktop x64
        run: |
          dotnet publish Fujify/Fujify.csproj -c Release -r win-x64 --self-contained true -o ./publish/win-x64

      - name: Publish Linux Desktop x64
        run: |
          dotnet publish Fujify/Fujify.csproj -c Release -r linux-x64 --self-contained true -o ./publish/linux-x64

      - name: Publish macOS Desktop arm64
        run: |
          dotnet publish Fujify/Fujify.csproj -c Release -r osx-arm64 --self-contained true -o ./publish/osx-arm64

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fujify-desktop-builds
          path: ./publish/

  # -------------------------------------------------------------
  # 2. Android App (APK & AAB)
  # -------------------------------------------------------------
  build-android:
    name: Build Android App (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET with Workloads
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Restore Android Project
        run: dotnet restore Fujify.Android/Fujify.Android.csproj

      - name: Build Android APK
        run: |
          dotnet build Fujify.Android/Fujify.Android.csproj -c Release -p:AndroidPackageFormat=apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: fujify-android-apk
          path: Fujify.Android/bin/Release/**/com.ipweb.fujify*.apk

  # -------------------------------------------------------------
  # 3. iOS App (iPhone & iPad)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS App & IPA (iPhone & iPad)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET with Workloads
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS Workload
        run: dotnet workload install ios

      - name: Restore iOS Project
        run: dotnet restore Fujify.iOS/Fujify.iOS.csproj

      - name: Select Latest Xcode
        run: |
          for xc in /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$xc" ]; then
              echo "Selecting $xc"
              sudo xcode-select -s "$xc/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Build and Package iOS IPA
        run: |
          dotnet build Fujify.iOS/Fujify.iOS.csproj -c Release -r ios-arm64 -p:EnableCodeSigning=false -p:CodesignKey="-" -p:ValidateXcodeVersion=false -p:_SuppressXcodeRequirementCheck=true -p:MtouchLink=None
          APP_PATH=$(find Fujify.iOS/bin/Release -name "*.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found!"
            exit 1
          fi
          # Ensure static archives (.a) are removed from the .app bundle to prevent codesign / Sideloadly failures
          find "$APP_PATH" -name "*.a" -delete
          mkdir -p ./publish/Payload
          cp -R "$APP_PATH" ./publish/Payload/
          cd ./publish
          zip -r -y Fujify-v2.1.0-iOS.ipa Payload
          cd ..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fujify-ios-ipa
          path: ./publish/Fujify-v2.1.0-iOS.ipa
